[package]
name = "uplinq-studio"
version = "1.0.0"
description = "Uplinq Studio: an SFTP, FTPS and FTP client for Windows"
license = "MIT"
repository = "https://github.com/Voltiq/Uplinq-Studio"
authors = ["Voltiq"]
edition = "2021"

[lib]
name = "uplinq_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Updates from GitHub Releases, signed
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "deprecated" enables implicit FTPS (TLS from the first byte, usually port 990).
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
# SFTP: pure-Rust SSH, using ring for crypto so no extra build tools are needed.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io-util"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Shell",
] }
# COM objects for dragging server files out to File Explorer.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_Marshal",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# Needed by windows' #[implement] macro.
windows-core = "0.61"
